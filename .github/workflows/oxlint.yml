name: oxlint

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["*"]
    tags-ignore: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Run oxlint
        run: pnpm exec oxlint --format=github
